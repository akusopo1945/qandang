name: Build Qandang APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Initialize Project Platforms
        run: |
          cd frontend_mobile
          flutter create . --platforms=android --org com.qandang.app
          # Patch minSdkVersion from 19 to 21 to support mobile_scanner
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

      - name: Generate Icons and Splash
        run: |
          cd frontend_mobile
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Build APK
        run: |
          cd frontend_mobile
          flutter build apk --release --project-name=Qandang

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qandang-App
          path: frontend_mobile/build/app/outputs/flutter-apk/app-release.apk
