name: Build Qandang APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend_mobile/**'
      - '.github/workflows/build_apk.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend_mobile/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Initialize Project Platforms
        run: |
          cd frontend_mobile
          if [ ! -d "android" ]; then
            flutter create . --platforms=android,ios --org com.qandang.app
          fi
          # Patch AndroidManifest.xml to add CAMERA permission for mobile_scanner and USE_BIOMETRIC
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application|' android/app/src/main/AndroidManifest.xml
          # Patch MainActivity.kt to use FlutterFragmentActivity for local_auth
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/g' android/app/src/main/kotlin/com/qandang/app/qandang/MainActivity.kt
          sed -i 's/class MainActivity: FlutterActivity()/class MainActivity: FlutterFragmentActivity()/g' android/app/src/main/kotlin/com/qandang/app/qandang/MainActivity.kt
          # Patch minSdkVersion from 19 to 21 to support mobile_scanner
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          # Patch Kotlin version in settings.gradle (Modern Flutter 3.19+)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          # Patch Kotlin version in build.gradle (Legacy Flutter)
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/g' android/build.gradle
          flutter pub get

      - name: Generate Icons and Splash
        run: |
          cd frontend_mobile
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        run: |
          cd frontend_mobile
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Qandang-App
          path: frontend_mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend_mobile/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            Pembaruan aplikasi mobile Qandang otomatis dari tag ${{ github.ref_name }}.
            Silakan unduh file `app-release.apk` di bawah.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
