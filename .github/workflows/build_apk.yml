name: Build Qandang APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          # Remove cache: 'gradle' because the project is in a subdirectory (frontend_mobile)
          # and it causes errors if it cannot find build.gradle in the root.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true # Cache Flutter SDK

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Initialize Project Platforms
        run: |
          cd frontend_mobile
          if [ ! -d "android" ]; then
            flutter create . --platforms=android,ios --org com.qandang.app
          fi
          # Patch minSdkVersion from 19 to 21 to support mobile_scanner
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          # Patch Kotlin version in settings.gradle (Modern Flutter 3.19+)
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/g' android/settings.gradle
          # Patch Kotlin version in build.gradle (Legacy Flutter)
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/g' android/build.gradle
          flutter pub get

      - name: Generate Icons and Splash
        run: |
          cd frontend_mobile
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build APK
        run: |
          cd frontend_mobile
          flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qandang-App
          path: frontend_mobile/build/app/outputs/flutter-apk/app-release.apk
