services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=qandang
      - DB_USERNAME=admin
      - DB_PASSWORD=secret
    depends_on:
      - db

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8001:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - APP_ENV=production

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=qandang
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./iot/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  postgres_data:
